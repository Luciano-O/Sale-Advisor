# Single-host VPS deployment (ADR 0007). Use together with compose.production.yaml:
#   docker compose --env-file .env.vps -f infra/compose.production.yaml -f infra/compose.vps.yaml up -d --build --wait
# API and admin listen only on loopback; the host's web server (Apache from the Enhance panel)
# terminates HTTPS and proxies to them. On a host without a web server, add `--profile caddy`.

services:
  api:
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:-3200}:3000"
    environment:
      CORS_ALLOWED_ORIGINS: https://${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      TRUST_PROXY_HOPS: 1

  admin:
    image: sale-advisor-admin:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/railway/admin.Dockerfile
      target: admin
      args:
        VITE_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-3201}:8080"

  caddy:
    profiles: ["caddy"]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
    volumes:
      - ./vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - sale-advisor-caddy-data:/data
      - sale-advisor-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./vps/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-/var/backups/sale-advisor}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sale-advisor-caddy-data:
  sale-advisor-caddy-config:
