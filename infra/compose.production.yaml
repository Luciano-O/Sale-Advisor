name: sale-advisor-production

x-common-environment: &common-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  api:
    image: sale-advisor-api:${IMAGE_TAG:-local}
    build:
      context: ..
      target: api
    init: true
    restart: unless-stopped
    environment:
      <<: *common-environment
      API_PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:${API_EXTERNAL_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    image: sale-advisor-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      target: worker
    init: true
    restart: unless-stopped
    environment:
      <<: *common-environment
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:?NOTIFICATION_PROVIDER is required}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      TELEGRAM_CHATS: ${TELEGRAM_CHATS:-}
      TELEGRAM_INITIAL_HISTORY_LIMIT: ${TELEGRAM_INITIAL_HISTORY_LIMIT:-100}
      WORKER_INSTANCE_ID: ${WORKER_INSTANCE_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: sale-advisor-migrate:${IMAGE_TAG:-local}
    build:
      context: ..
      target: migrate
    restart: "no"
    environment:
      <<: *common-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sale-advisor-production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      ["/bin/sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - sale-advisor-production-redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sale-advisor-production-postgres:
  sale-advisor-production-redis:
